// Native OpenGL reference configuration for YAE comparison runs.
// The GLIntercept loader forwards to the system driver instead of QindieGL;
// per-call tracing and glGetError injection stay disabled.

FunctionLog
{
  LogEnabled = False;
  LogFlush = False;
  LogFileName = "gliInterceptLog_NATIVE";
}

LogPerFrame { Enabled = False; }

InputFiles
{
  GLFunctionDefines = "QindieGL-GLFunctions\\QindieGL-gliIncludes.h";
  GLSystemLib = "C:\\Windows\\SysWOW64\\opengl32.dll";
}

ErrorChecking
{
  GLErrorChecking = False;
  ThreadChecking = False;
  BreakOnError = False;
  LogOnError = False;
}

ImageLog { LogEnabled = False; }
ShaderLog { LogEnabled = False; }
DisplayListLog { LogEnabled = False; }
FrameLog { LogEnabled = False; }
TimerLog { LogEnabled = False; }

PluginData { Plugins { } }
